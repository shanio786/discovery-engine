[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ode"
version = "0.4.0"
description = "Opportunity Discovery Engine — cross-platform demand arbitrage"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "asyncpg>=0.29",
    "structlog>=24.1",
    "PyYAML>=6.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "tenacity>=8.2",
    "numpy>=1.26",
    "google-play-scraper>=1.2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.4",
]

[project.scripts]
ode = "ode.cli:main"

[tool.setuptools.packages.find]
include = ["ode*"]

[tool.setuptools.package-data]
ode = ["sql/*.sql"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["db: needs a real Postgres/TimescaleDB (set ODE_TEST_DATABASE_URL)"]

[tool.ruff]
line-length = 100
target-version = "py311"
