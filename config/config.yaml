# ==================================================================
# Opportunity Discovery Engine — runtime config
# Everything tunable lives here, not in code. Validated on load.
# ==================================================================

# Markets every collector runs across. Wikipedia discovery, scoring and
# YouTube probes work in ANY language automatically; Reddit only where a scope
# is configured below, Hacker News only in its one English market.
# Cost: ~2,000 tracked articles per market, all free. Remove markets you don't
# want; add any `<lang>-<REGION>` (e.g. ko-KR, ar-SA, vi-VN).
markets:
  - en-US
  - de-DE
  - ja-JP
  - fr-FR
  - es-ES
  - it-IT
  - pt-BR
  - nl-NL
  - pl-PL
  - tr-TR
  - id-ID
  - hi-IN
  - ur-PK
  - ar-SA
  - ko-KR
  - vi-VN

all_markets: [en-US, en-GB, de-DE, ja-JP, fr-FR, es-ES, it-IT, pt-BR, nl-NL, pl-PL,
              tr-TR, id-ID, hi-IN, ur-PK, ar-SA, ko-KR, vi-VN, sv-SE, bn-BD, th-TH,
              ru-RU, uk-UA, fa-IR, ms-MY, ro-RO, cs-CZ, el-GR, hu-HU, fi-FI, da-DK, no-NO]

# Relative value of one visitor per market (ads CPM / sponsor budgets), US = 1.0.
# ROUGH public estimates — replace with your own RPM once you have revenue.
# Low-value markets can still win: far less competition, easier to rank/go viral.
market_value:
  en-US: 1.00
  en-GB: 0.85
  de-DE: 0.85
  nl-NL: 0.70
  ja-JP: 0.75
  sv-SE: 0.70
  fr-FR: 0.60
  ko-KR: 0.55
  it-IT: 0.50
  es-ES: 0.45
  ar-SA: 0.45
  pl-PL: 0.30
  pt-BR: 0.25
  tr-TR: 0.15
  vi-VN: 0.12
  id-ID: 0.12
  hi-IN: 0.10
  ur-PK: 0.08
  bn-BD: 0.06
  th-TH: 0.15
  ru-RU: 0.20

wiki_project_overrides:
  en-US: en.wikipedia
  en-GB: en.wikipedia
  pt-BR: pt.wikipedia

# ------------------------------------------------------------------
# Seeds = starting points for discovery (any subject works; content is
# produced with AI, so the subject only has to have demand and room). `wiki` is the ENGLISH article title;
# its title in every other language is resolved automatically through
# Wikidata. `queries` are per LANGUAGE — a seed with no query for a
# language is not searched in that market (no English noise in de-DE).
# `hn` is a short core term for Hacker News (long queries rarely match titles).
# `audience: b2b` = professional audience -> SPONSOR monetization is realistic.
# ------------------------------------------------------------------
seeds:
  - key: home_assistant
    name: Home Assistant
    wiki: Home Assistant
    queries: {en: "home assistant automation", de: "home assistant automatisierung"}
    hn: "Home Assistant"
  - key: n8n
