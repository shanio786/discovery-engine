# ------------------------------------------------------------------
# Discovery: find topics nobody told us about.
#   wiki_top  = each language's daily top-1000 articles (mainstream breakouts)
#   morelike  = Wikipedia "similar articles" around every seed (niche
#               neighbourhood — where tutorial topics actually live)
#   langlink  = every discovered topic is also tracked in every other market
#               (the cross-language arbitrage backbone)
# ------------------------------------------------------------------
discovery:
  top_days_back: 3              # daily: scan the last 3 available days
  bootstrap_days_back: 14       # first run: scan 2 weeks
  morelike_per_seed: 25
  max_tracked_per_market: 2000  # watchlist cap per market (seeds never evicted)
  stale_after_days: 45          # wiki_top/morelike items not re-seen -> inactive
  # Wikidata classes (direct P31) that are never content opportunities for this
  # operator: people, media releases, sports, elections, wiki meta pages.
  exclude_wikidata_classes:
    Q5: human
    Q4167410: disambiguation page
    Q4167836: category
    Q13406463: list article
    Q11424: film
    Q5398426: television series
    Q21191270: television episode
    Q3464665: television season
    Q15416: television program
    Q482994: album
    Q134556: single
    Q7366: song
    Q215380: musical group
    Q27020041: sports season
    Q476028: football club
    Q847017: sports club
    Q40231: election
    Q178561: battle
    Q198: war
    Q7725634: literary work
  # Titles matching these regexes are skipped before any API call.
  exclude_title_patterns:
    - '^\d{4}([–-]\d{2,4})?[ _](?!\()'   # "2024 ...", "2023–24 ..." (events, seasons), not "1984 (novel)"
    - '^(List[ _]of|Liste[ _]der|Liste[ _]von|Deaths[ _]in|Todesfälle)[ _]'
  # Exact titles to skip (underscores and spaces are treated the same).
  exclude_titles: ["-", "Main Page", "Hauptseite", "Undefined", "Wikipedia"]

# ------------------------------------------------------------------
# Reddit: one distinct signal per market. en-US = site-wide English search;
# other markets = their own national/language subreddits. Markets without a
# scope are skipped (recorded as `skipped`), never given duplicate data.
# ------------------------------------------------------------------
reddit:
  max_pages: 5                  # x100 posts per query per run
  unanswered_min_age_hours: 48  # brand-new posts aren't "unanswered" yet
  scopes:
    en-US: {mode: global}
    en-GB: {subreddits: [unitedkingdom, CasualUK, AskUK, ukpersonalfinance]}
    de-DE: {subreddits: [de, de_EDV, Finanzen, selbststaendig, homeassistant_de]}

youtube:
  max_results: 25
  seed_refresh_days: 3          # re-search a seed at most every 3 days
  max_probes_per_market: 4      # top discovered topics checked per run (~102 units each)
  probe_refresh_days: 30        # re-probe a topic after this long
  max_month_fills: 40           # monthly-upload backfill searches per run (100 units each)
  saturation_months: 12
  shorts_competition: true      # extra search (100 units) for short videos per topic ...
  max_shorts_checks: 6          # ... for at most this many topics per market per run

# Play Store: what apps exist for a topic and how good they are. Unofficial
# scraper — throttled hard; failures never affect other sources.
playstore:
  max_queries_per_market: 12    # seeds + best-scoring topics, per run (~4 calls each)
  refresh_days: 7               # re-check a topic at most weekly
  top_apps: 3                   # detail-check this many top results
  stale_after_days: 365         # top app not updated for a year = abandoned

# Gemini briefs for the top actions (optional; needs GEMINI_API_KEY).
gemini:
  model: gemini-2.5-flash
  max_briefs_per_day: 5
  reuse_days: 14                # don't regenerate a brief for the same action sooner

# Platform recommendations (`ode plan`): which format to build for a topic.
actions:
  top_n: 25                     # actions listed in the plan
  per_market_max: 5             # spread the plan over markets
  per_topic_max: 3              # e.g. Shorts + YouTube + Blog for one breakout
  also_in_max: 6                # "same action, other open languages" listed per item
  min_confidence: 0.0
  # supply/demand: competing YouTube videos (180d) per daily Wikipedia view;
  # at this ratio YouTube ease bottoms out
  saturated_ratio: 100

# Backtest (`ode backtest`, weekly in the scheduler): did past top-k really grow?
backtest:
  horizon_days: 30             # look this far after each cut-off
  cutoff_offsets_days: [0, 30, 60]   # cut-offs = newest data - horizon - offset
  growth_ratio: 1.5            # "grew" = next-30-day mean >= 1.5x the previous 30 days
  k: 20                        # precision@20
  min_universe: 50             # cut-offs with fewer evaluable topics are skipped
  learn_weights: true          # grid-search composite weights on the samples
  apply_learned_weights: true  # scorer uses them — only once they clearly beat the config
  min_improvement: 0.05        # >= 5% better mean lift AND better on most cut-offs

# Research miners (run in `ode daily` after scoring, and by `ode mine`).
miners:
  autocomplete:                # Google Autocomplete long-tail questions per plan topic
    enabled: true
    max_topics: 15             # unique plan topics per run (~32 requests each, 1/s)
    refresh_days: 7
    max_per_topic: 40
    letters: true              # also "<topic> a" … "<topic> z" (Latin-script languages)
  complaints:                  # 1-star Play Store reviews for APP / TOOLSITE plan items
    enabled: true
    max_topics: 8
    top_apps: 3
    per_app: 6
    refresh_days: 14
  formats:                     # serial outliers: small channels that keep going viral
    enabled: true
    min_multiple: 5.0          # a hit = views >= 5x the channel's subscribers
    min_outliers: 2            # ... at least this many hits
    min_subs: 100
    max_subs: 200000           # small/medium channels only (a format, not a celebrity)
    within_days: 365
    max_formulas: 5            # Gemini one-line format formula per run (GEMINI_API_KEY)

# Production pack for your automation (n8n): `ode export`, scheduler job `export`.
export:
  max_items: 25                # items POSTed to N8N_WEBHOOK_URL per day

# Learning from YOUR results (`ode done` / `ode result`). Your real revenue per
# visitor recalibrates market_value; your revenue per hour per platform
# re-weights platforms. Priors count as this much evidence, so one lucky
# video can't swing everything.
learning:
  enabled: true
  pseudo_views: 20000          # the prior market_value counts as 20k views of evidence
  pseudo_items: 3              # platform weight starts at 1.0 worth 3 results

# ------------------------------------------------------------------
# Realtime layer (run by `ode scheduler`, also callable one-off).
# ------------------------------------------------------------------
realtime:
  # Wikipedia hourly pageview dumps (public, ~50 MB/hour). Same-day spikes.
  hourly:
    enabled: true
    min_views_per_hour: 80     # rows below this are not stored (keeps the DB small)
    window_hours: 3            # compare the last 3 hours ...
    baseline_hours: 48         # ... with the same-length windows of the last 2 days
    spike_ratio: 5.0           # >= 5x its own normal = spike
    min_window_views: 600      # and at least this many views in the window
    new_article_views: 3000    # unseen in the baseline but this big = spike too
    max_alerts_per_run: 10
    include_people: false      # people/events are viral but risky; off by default
  # Google Trends "trending now" RSS per country (free, no key).
  trends:
    enabled: true
    min_traffic: 2000          # approx searches before we care
    add_to_watchlist: true     # matched Wikipedia articles start being tracked
    max_alerts_per_run: 5

# Alerts (Telegram). Same alert never repeats within its cooldown.
alerts:
  breakout:
    spike_ratio: 3.0           # spec: 7d vs prior 7d > 3x ...
    max_competing_videos: 20   # ... where competing content < 20 (or not measured yet)
    cooldown_days: 7
  realtime_cooldown_hours: 24
  trends_cooldown_hours: 24
  plan_top_n: 5                # morning message: today's top actions

# Seasonal peaks (from >= 13 months of daily history).
seasonal:
  min_history_days: 365
  peak_ratio: 2.0              # a month >= 2x the year's median month = a season
  lead_weeks: [2, 8]           # suggest starting 2-8 weeks before the peak month

# Always-on scheduler (`ode scheduler`): what runs when (UTC).
scheduler:
  daily_at: "04:17"            # full cycle: discover -> collect -> score -> miners -> briefs
  reports_at: "06:37"          # reports/plan-latest.md + gems-latest.md/.csv
  plan_message_at: "06:47"     # Telegram: today's plan
  export_at: "06:52"           # production pack -> N8N_WEBHOOK_URL + reports/pack-latest.json
  midday_wiki_at: "16:17"      # cheap refresh for late-published days
  backup_note: "backups run from host cron (scripts/backup.sh)"
  every:
    hourly_wiki_minutes: 60    # ingest the newest hourly dump + spike check
    trends_minutes: 60         # Google Trends per market
    breakout_minutes: 360      # spec: breakout alert check every 6h
    backtest_days: 7           # weekly backtest + weight learning

# Hacker News is one global English audience: attribute it to ONE market so
# en-US / en-GB never receive the same signal twice.
hackernews:
  market: en-US

# How far back a topic's FIRST collect reaches. Later runs are incremental.
lookback_days:
  wikipedia: 400      # ~13 months — enough for the 12-month saturation forecast
  youtube: 180
  reddit: 90
  hackernews: 90

# Re-fetched on every incremental run (upstream data arrives late / is revised).
incremental_overlap_days:
  wikipedia: 3
  hackernews: 2
  reddit: 2

# Requests/sec + burst per upstream host family. Polite by design.
rate_limits:
  wikipedia:  {rate: 25.0, burst: 25}
  wikidata:   {rate: 4.0,  burst: 4}
  youtube:    {rate: 5.0,  burst: 5}
  reddit:     {rate: 1.5,  burst: 5}    # ~100/min OAuth limit
  playstore:  {rate: 1.0,  burst: 2}    # unofficial scraping: stay polite
  gemini:     {rate: 0.5,  burst: 1}
  telegram:   {rate: 1.0,  burst: 3}
  trends:     {rate: 0.5,  burst: 1}
  autocomplete: {rate: 1.0, burst: 2}   # Google suggest: polite (use HTTPS_PROXY if blocked)
  dumps:      {rate: 1.0,  burst: 1}
  hackernews: {rate: 5.0,  burst: 10}

# Parallel in-flight requests per source (the rate limit still applies).
concurrency:
  wikipedia: 8
  wikidata: 2
  hackernews: 4
  reddit: 1
  youtube: 1
  playstore: 1

# Persisted daily quota caps. Calls that would exceed are refused, not failed.
quotas:
  youtube: 9000        # headroom under the 10k/day hard limit
  reddit: null
  wikipedia: null
  hackernews: null
  playstore: null

youtube_unit_cost:
  search: 100
  videos: 1
  channels: 1

http:
  timeout_seconds: 30
  max_retries: 4
  backoff_base_seconds: 2.0       # 2, 4, 8, 16
  circuit_breaker_failures: 10    # consecutive failures -> abort that run

# ------------------------------------------------------------------
# Scoring (Phase 2). Scores are UNVALIDATED until the Phase-7 backtest
# reports precision@20 — `ode gems` says so in its header.
# ------------------------------------------------------------------
scoring:
  min_series_points: 60         # fewer daily points -> phase UNKNOWN, multiplier 1.0
  min_mean_daily: 1.0           # average below this -> no real demand -> UNKNOWN
  spike_persist_days: 5         # a rise must hold this many days to count
  momentum_window_days: 180
  fresh_within_days: 14         # only score topics with data this recent
  momentum:
    velocity_threshold: 0.002   # relative growth per day (~6%/month)
    breakout_accel: 0.3
    growing_accel: -0.1
    accel_min_t: 2.0            # acceleration must be >= 2 standard errors from zero
    multipliers: {BREAKOUT: 3.0, GROWING: 1.8, PEAKING: 0.6, STABLE: 1.0,
                  DECLINING: 0.3, UNKNOWN: 1.0}
  demand_weights: {wikipedia: 0.5, reddit: 0.3, hackernews: 0.2}
  # Weighted geometric mean of demand, money, gap and openness (=101-competition),
  # times the momentum multiplier. A missing component counts as neutral (50)
  # instead of zeroing the score, and lowers confidence instead.
  composite_weights: {demand: 1.0, money: 1.0, gap: 1.0, competition: 1.0}
  outlier_cap: 50               # views/subs at which the outlier part of GAP maxes out
  dominant_channel_share: 0.30  # one channel owning more than this = covered topic
  probe_top_k: 8                # best unprobed topics per market queued for YouTube

# ------------------------------------------------------------------
# Monetization. Paths you are willing to use. Removed BY CHOICE: affiliate,
# SaaS and selling your own products. Revenue per visitor (USD, estimates).
# ------------------------------------------------------------------
monetization:
  enabled_paths: [SPONSOR, APP, ADS]
  rpv: {SPONSOR: 0.25, APP: 0.030, ADS: 0.010}
  tutorial_ads_multiplier: 1.5  # how-to / tech audiences earn a higher ad RPM (estimate)
  secondary_weight: 0.2         # extra eligible paths add 20% of their RPV
  # how-to / tutorial intent (raises ad value; marks teachable topics)
  tutorial_keywords: [how to, tutorial, build, automate, automation, setup, guide,
                      anleitung, einrichten, automatisieren, automatisierung, installieren,
                      erstellen, projekt, tutoriel, guía, guida, poradnik, uitleg,
                      nasıl, cara, 使い方]
  # utility intent -> a Play Store app and/or an AI-built web tool site
  app_keywords: [tracker, calculator, planner, converter, monitor, timer, counter,
                 rechner, umrechner, planer, calculadora, conversor, calculatrice,
                 convertisseur, calcolatrice, kalkulator, hesaplama, 計算]
  tool_keywords: [calculator, converter, generator, checker, counter, maker, finder,
                  planner, timer, estimator, formula, calculation, conversion, unit,
                  rechner, umrechner, berechnen, calculadora, conversor, generador,
                  calculatrice, convertisseur, générateur, calcolatrice, convertitore,
                  kalkulator, przelicznik, hesaplama, dönüştürücü, konversi, 計算, 変換]
  # comparison / review intent was affiliate territory -> deprioritised
  comparison_keywords: [" vs ", versus, best, review, comparison, alternative, vergleich, test]
  comparison_penalty: 0.7
  # Wikidata classes whose topics are teachable (tutorial intent).
  tutorial_classes: [Q7397, Q166142, Q9143, Q193424, Q235557, Q11016, Q68, Q28640,
                     Q11862829]
  # Human-readable names for classes (shown in reports).
  class_labels: {Q7397: software, Q166142: application, Q9143: programming language,
                 Q193424: web service, Q35127: website, Q235557: file format,
                 Q11016: technology, Q2424752: product, Q68: computer, Q28640: profession,
                 Q11862829: academic discipline}
  # Wikidata class (P31) -> extra eligible paths. Heuristic; extend as you learn.
  class_paths:
    Q7397: [SPONSOR]               # software: tool makers sponsor tutorials
    Q166142: [SPONSOR]             # application
    Q9143: [SPONSOR]               # programming language
    Q235557: [APP]                 # file format: viewers / converters
    Q28640: [SPONSOR]              # profession: B2B audience
